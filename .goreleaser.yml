# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: annotr

before:
  hooks:
    - go mod tidy

builds:
  - id: annotr
    main: ./cmd/annotr/main.go
    binary: annotr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: annotr
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: annotr
    repository:
      owner: cloudboy-jh
      name: homebrew-annotr
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/cloudboy-jh/annotr"
    description: "annotr - Fast local code commenting CLI"
    license: "MIT"
    binaries:
      - annotr

scoops:
  - name: annotr
    repository:
      owner: cloudboy-jh
      name: scoop-annotr
      token: "{{ .Env.SCOOP_BUCKET_PAT }}"
    homepage: "https://github.com/cloudboy-jh/annotr"
    description: "annotr - Fast local code commenting CLI"
    license: MIT
